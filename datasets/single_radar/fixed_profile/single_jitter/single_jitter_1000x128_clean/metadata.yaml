  multipath_prob: 0.0
  aoa_drift_rate: 0.0
  toa_noise_std: 0.0
  freq_noise_std: 0.0
  pw_noise_std: 0.0
  amp_noise_std: 0.0
  aoa_noise_std: 0.0
  global_drop_rate: 0.0
  noise_rate: 0.0
