name: single_dwell_and_switch_1000x128_clean
radar_type: dwell_and_switch
sequence_count: 1000
expected_pulses_per_sequence: 128
error_level: clean
error_parameters:
  poi: 1.0
  multipath_prob: 0.0
  aoa_drift_rate: 0.0
  toa_noise_std: 0.0
  freq_noise_std: 0.0
  pw_noise_std: 0.0
  amp_noise_std: 0.0
  aoa_noise_std: 0.0
