name: single_stable_1000x128
description: Clean single stable radar PRI dataset with 1000 independent sequences
  and 128 pulses per sequence.
radar_type: stable
sequence_count: 1000
pulses_per_sequence: 128
files:
  train: train/sequences.csv
  val: val/sequences.csv
  test: test/sequences.csv
  individual_sequence_files: Each split folder also contains one CSV per sequence,
    named seq_XXXX.csv.
split:
  train:
    ratio: 0.7
    sequence_count: 700
    row_count: 89600
  val:
    ratio: 0.1
    sequence_count: 100
    row_count: 12800
  test:
    ratio: 0.2
    sequence_count: 200
    row_count: 25600
generator:
  radar_class: StableRadar
  environment_class: Environment
  source_file: synthetic data generation/radar_generator.py
  random_seed: 42
radar_parameters:
  radar_id: R_STABLE
  pri_us: 1000.0
  freq_mean_mhz: 9000.0
  freq_mode: fixed
  freq_hopping_values: null
  poi: 1.0
  multipath_prob: 0.0
  multipath_delay_mean: 0.0
  pw_mean_us: 1.5
  amp_mean_dbm: -55.0
  aoa_mean_deg: 45.0
  scan_period: null
  aoa_drift_rate: 0.0
  stretch_pw_on_multipath: false
environment_parameters:
  duration_us: 128000.0
  toa_noise_std: 0.0
  freq_noise_std: 0.0
  global_drop_rate: 0.0
  noise_rate: 0.0
  quantize: false
simplifications:
  missing_pulse_rate: 0.0
  false_pulse_rate: 0.0
  toa_noise: 0.0
  frequency_noise: 0.0
  aoa_drift: 0.0
  multipath: 0.0
  target_motion: none
  receiver_quantization: none
  interleaving: none
units:
  toa: microseconds
  pri: microseconds
  freq: MHz
  pw: microseconds
  amp: dBm
  aoa: degrees
